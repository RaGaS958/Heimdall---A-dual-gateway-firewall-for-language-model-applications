# Serves the built site and forwards /api/* to the middleware, so the browser talks to one origin
# and the Content-Security-Policy can stay 'self' only. TLS belongs in front of this (a host proxy
# or load balancer); see knowledge-base/06-operations/operations.md.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    gzip_static on;
    client_max_body_size 64k;

    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; media-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    location = /healthz { access_log off; default_type text/plain; return 200 "ok\n"; }

    # The middleware, under /api. The trailing slash on proxy_pass strips the /api prefix.
    location /api/ {
        proxy_pass http://middleware:7860/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        # The live layer trace is a server-sent event stream: no buffering, long reads.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 120s;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
